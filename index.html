
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eu Kasconta" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Eukasconta</title>
    <style>
      body {
        background-color: #0A0A0C;
        color: #F6F3EA; /* Zinc 100 */
      }
      
      /* Elegant Scrollbar - Global Styling */
      /* Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: #2A2A31 #0A0A0C;
      }

      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }

      ::-webkit-scrollbar-track {
        background: #0A0A0C;
      }

      ::-webkit-scrollbar-thumb {
        background-color: #2A2A31;
        border-radius: 9999px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: #3a3a42;
      }

      ::-webkit-scrollbar-corner {
        background: #0A0A0C;
      }

      /* Teclado na tela (celular): a folha sobe para o topo e cabe na parte visível (ver services/keyboardAvoid.ts) */
      @media (pointer: coarse) and (max-width: 639px) {
        html.kb-open [role="dialog"][aria-modal="true"] {
          max-height: var(--kb-visible, 54dvh) !important;
          border-radius: 1.75rem !important;
        }
        html.kb-open div:has(> [role="dialog"][aria-modal="true"]) {
          align-items: flex-start !important;
          padding-top: max(env(safe-area-inset-top), 8px) !important;
        }
      }

      /* Light Theme Overrides */
      html.light-theme body {
        background-color: #F6F3EA;
        color: #1B1912; /* zinc-950 */
      }
      
      html.light-theme * {
        scrollbar-color: #D8D2C0 #EFEBDF;
      }
      html.light-theme { --donut-label: #57524A; --donut-line: #948F84; --est-name: #1B1912; --est-money: #57524A; --est-money-in: #57524A; }
      html.light-theme ::-webkit-scrollbar-track { background: #EFEBDF; }
      html.light-theme ::-webkit-scrollbar-thumb { background-color: #D8D2C0; }
      html.light-theme ::-webkit-scrollbar-thumb:hover { background-color: #948F84; }
      html.light-theme ::-webkit-scrollbar-corner { background: #EFEBDF; }

      html.light-theme .bg-black { background-color: #F6F3EA; }
      html.light-theme .bg-black\/10 { background-color: rgba(0, 0, 0, 0.02); }
      html.light-theme .bg-black\/20 { background-color: rgba(0, 0, 0, 0.04); }
      html.light-theme .bg-black\/40 { background-color: rgba(0, 0, 0, 0.06); }
      html.light-theme .bg-black\/50 { background-color: rgba(0, 0, 0, 0.08); }
      html.light-theme .bg-black\/60 { background-color: rgba(255, 255, 255, 0.8); }
      /* Fundos de janelas (folhas/diálogos): no claro escurecem com um tom quente em vez de cinza chapado */
      html.light-theme .bg-black\/70 { background-color: rgba(27, 25, 18, 0.42); }
      html.light-theme .bg-black\/85 { background-color: rgba(27, 25, 18, 0.5); }
      html.light-theme .bg-black\/75 { background-color: rgba(255, 255, 255, 0.92); }
      html.light-theme .bg-black\/30 { background-color: rgba(27, 25, 18, 0.04); }
      html.light-theme .bg-zinc-900\/95 { background-color: rgba(255, 255, 255, 0.96); }
      html.light-theme .bg-zinc-900\/60 { background-color: rgba(239, 235, 223, 0.6); }
      html.light-theme .bg-black\/80 { background-color: rgba(255, 255, 255, 0.9); }
      html.light-theme .bg-black\/90 { background-color: rgba(255, 255, 255, 0.95); }
      html.light-theme .bg-black\/95 { background-color: rgba(255, 255, 255, 0.98); }
      
      html.light-theme .text-white { color: #1B1912; }
      
      html.light-theme .border-white\/5 { border-color: rgba(0, 0, 0, 0.05); }
      html.light-theme .border-white\/10 { border-color: rgba(0, 0, 0, 0.1); }
      html.light-theme .border-white\/20 { border-color: rgba(0, 0, 0, 0.2); }
      html.light-theme .border-white\/30 { border-color: rgba(0, 0, 0, 0.3); }
      
      html.light-theme .bg-white\/5 { background-color: rgba(0, 0, 0, 0.05); }
      html.light-theme .bg-white\/10 { background-color: rgba(0, 0, 0, 0.1); }
      html.light-theme .bg-white\/20 { background-color: rgba(0, 0, 0, 0.2); }
      html.light-theme .bg-white\/\[0\.01\] { background-color: rgba(0, 0, 0, 0.01); }
      html.light-theme .bg-white\/\[0\.02\] { background-color: rgba(0, 0, 0, 0.02); }
      html.light-theme .bg-white\/\[0\.03\] { background-color: rgba(0, 0, 0, 0.03); }
      html.light-theme .bg-white\/\[0\.04\] { background-color: rgba(0, 0, 0, 0.04); }
      html.light-theme .bg-white\/\[0\.05\] { background-color: rgba(0, 0, 0, 0.05); }
      html.light-theme .bg-white\/\[0\.06\] { background-color: rgba(0, 0, 0, 0.06); }
      
      html.light-theme .text-zinc-100 { color: #1B1912; }
      html.light-theme .text-zinc-200 { color: #2A2620; }
      html.light-theme .text-zinc-300 { color: #57524A; }
      html.light-theme .text-zinc-400 { color: #57524A; }
      html.light-theme .text-zinc-500 { color: #6F6A5E; }
      html.light-theme .placeholder\:text-zinc-200::placeholder { color: #2A2620; }
      html.light-theme .placeholder\:text-zinc-500::placeholder { color: #6F6A5E; }
      html.light-theme .text-zinc-600 { color: #948F84; }
      html.light-theme .text-zinc-700 { color: #D8D2C0; }
      html.light-theme .text-zinc-800 { color: #E6E1D2; }
      html.light-theme .text-zinc-900 { color: #EFEBDF; }
      html.light-theme .text-zinc-950 { color: #ffffff; }
      
      html.light-theme .bg-zinc-950 { background-color: #ffffff; }
      html.light-theme .bg-zinc-950\/95 { background-color: rgba(255, 255, 255, 0.95); }
      /* Cores hexadecimais fixas usadas como "cartão escuro" em várias telas
         (Relatórios, Detalhe de Recibo, Config, Lançamento Manual...). Sem
         esta tradução, essas telas ficam com blocos pretos flutuando sobre
         o fundo branco do tema claro. */
      html.light-theme .bg-\[\#08080a\] { background-color: #ffffff; }
      html.light-theme .bg-\[\#1B1912\] { background-color: #ffffff; }
      html.light-theme .bg-\[\#0c0c0e\] { background-color: #ffffff; }
      html.light-theme .bg-\[\#121214\] { background-color: #FFFFFF; }
      html.light-theme .bg-\[\#161618\] { background-color: #EFEBDF; }
      html.light-theme .bg-zinc-900 { background-color: #EFEBDF; }
      html.light-theme .bg-zinc-900\/10 { background-color: rgba(239, 235, 223, 0.1); }
      html.light-theme .bg-zinc-900\/20 { background-color: rgba(239, 235, 223, 0.2); }
      html.light-theme .bg-zinc-900\/30 { background-color: rgba(255, 255, 255, 0.7); }
      html.light-theme .bg-zinc-900\/40 { background-color: rgba(239, 235, 223, 0.4); }
      html.light-theme .bg-zinc-900\/50 { background-color: rgba(239, 235, 223, 0.5); }
      html.light-theme .bg-zinc-900\/80 { background-color: rgba(239, 235, 223, 0.8); }
      html.light-theme .bg-zinc-800 { background-color: #E6E1D2; }
      html.light-theme .bg-zinc-800\/50 { background-color: rgba(230, 225, 210, 0.5); }
      html.light-theme .bg-zinc-600 { background-color: #948F84; }
      html.light-theme .bg-surface { background-color: #EFEBDF; }
      html.light-theme .bg-surface\/20 { background-color: rgba(239, 235, 223, 0.2); }
      html.light-theme .bg-surface\/30 { background-color: rgba(239, 235, 223, 0.3); }
      html.light-theme .bg-surfaceHighlight { background-color: #E6E1D2; }
      
      html.light-theme .hover\:bg-white:hover { background-color: #1B1912; }
      html.light-theme .hover\:bg-zinc-200:hover { background-color: #2A2620; }
      html.light-theme .hover\:bg-zinc-800:hover { background-color: #E6E1D2; }
      html.light-theme .hover\:bg-zinc-900:hover { background-color: #EFEBDF; }
      html.light-theme .hover\:bg-zinc-900\/40:hover { background-color: rgba(239, 235, 223, 0.4); }
      html.light-theme .hover\:bg-white\/5:hover { background-color: rgba(0, 0, 0, 0.05); }
      html.light-theme .hover\:bg-white\/10:hover { background-color: rgba(0, 0, 0, 0.1); }
      html.light-theme .hover\:bg-white\/\[0\.02\]:hover { background-color: rgba(0, 0, 0, 0.02); }
      html.light-theme .hover\:text-white:hover { color: #1B1912; }
      html.light-theme .hover\:text-zinc-300:hover { color: #57524A; }
      html.light-theme .hover\:text-zinc-400:hover { color: #57524A; }
      html.light-theme .hover\:border-white:hover { border-color: #1B1912; }
      html.light-theme .hover\:border-white\/10:hover { border-color: rgba(0, 0, 0, 0.1); }
      html.light-theme .hover\:border-white\/20:hover { border-color: rgba(0, 0, 0, 0.2); }
      html.light-theme .hover\:border-white\/30:hover { border-color: rgba(0, 0, 0, 0.3); }
      html.light-theme .hover\:bg-white\/5:hover { background-color: rgba(0, 0, 0, 0.05); }
      html.light-theme .hover\:bg-white\/10:hover { background-color: rgba(0, 0, 0, 0.1); }
      html.light-theme .hover\:bg-white\/\[0\.04\]:hover { background-color: rgba(0, 0, 0, 0.04); }
      
      html.light-theme .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); }
      html.light-theme .shadow-xl { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); }
      
      html.light-theme .border-zinc-800 { border-color: #E6E1D2; }

      /* Timeline do Estúdio: linha fina com um brilho leve; pontos vazados na cor do cartão */
      .tl-chart .recharts-area-curve { filter: drop-shadow(0 0 3px rgba(221, 185, 75, 0.35)); }
      .tl-dot { fill: #000; }
      html.light-theme .tl-chart .recharts-area-curve { filter: none; }
      html.light-theme .tl-dot { fill: #ffffff; }
      /* Botão do período (barra de filtros fechada): dourado mais escuro para ler no fundo claro */
      html.light-theme .dept-active { color: #7A5A06; }
      html.light-theme .filter-chip { color: #7A5A06; border-color: rgba(138, 106, 10, 0.35); background-color: rgba(221, 185, 75, 0.14); }
      /* Cupom em texto: no claro é texto limpo num sépia bem leve (sem o cinza e sem os efeitos de tela) */
      html.light-theme .thermal-box { background-color: #FBF6E6; border-color: #E2DCCB; color: #2e281c; box-shadow: none; }
      html.light-theme .thermal-fx { display: none; }
      /* Mapa: as imagens do OpenStreetMap são claras; no tema escuro o painel de imagens é invertido para combinar com o app */
      .map-dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.92) saturate(0.75); }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
