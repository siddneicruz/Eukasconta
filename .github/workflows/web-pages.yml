name: Versão web (GitHub Pages)

# Publica o app como site: https://<usuário>.github.io/<repositório>/
# Uma vez só: Settings > Pages > Build and deployment > Source = "GitHub Actions".
# O login (Google ou e-mail) é obrigatório nesta versão (VITE_WEB_LOGIN_REQUIRED=1); o app Android não é afetado.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_WEB_LOGIN_REQUIRED: '1'
      - name: Página de volta para links diretos
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
