name: Mapas (sondagem)

on:
  push:
    branches: [mapas-probe]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tamanhos por célula de 1 grau e CORS do raw.githubusercontent
        run: |
          set +e
          R=report2.txt
          : > $R
          say() { echo "$@" | tee -a $R; }
          url=$(curl -s https://api.github.com/repos/protomaps/go-pmtiles/releases/latest | jq -r '.assets[] | select(.name|test("Linux_x86_64.tar.gz$")) | .browser_download_url' | head -1)
          curl -sL "$url" | tar xz pmtiles
          KEY=$(curl -s https://build-metadata.protomaps.dev/builds.json | jq -r 'sort_by(.uploaded) | last | .key')
          SRC=https://build.protomaps.com/$KEY
          say "SRC=$SRC"

          # tamanho por célula (z13 e z14) no Sul do Brasil
          : > cells.csv
          for lon in -57 -56 -55 -54 -53 -52 -51 -50 -49; do
            for lat in -34 -33 -32 -31 -30 -29 -28 -27 -26 -25 -24 -23; do
              w=$lon; e=$((lon+1)); s=$lat; n=$((lat+1))
              for z in 13 14; do
                out=$(./pmtiles extract $SRC /tmp/x.pmtiles --bbox=$w,$s,$e,$n --maxzoom=$z --dry-run 2>&1 | grep "archive size")
                size=$(echo "$out" | sed -E 's/.*archive size of ([0-9.]+) ([kKMG]?B).*/\1 \2/')
                echo "$w,$s,$z,$size" >> cells.csv
              done
            done
          done
          say "== células (lon,lat,zoom,tamanho)"
          python3 - <<'PY' | tee -a $R
          import csv,re
          mult={'B':1,'kB':1e3,'KB':1e3,'MB':1e6,'GB':1e9}
          rows=[]
          for line in open('cells.csv'):
              p=line.strip().split(',')
              if len(p)<4: continue
              try:
                  v,u=p[3].split(); b=float(v)*mult[u]
              except Exception: continue
              rows.append((int(p[0]),int(p[1]),int(p[2]),b))
          for z in (13,14):
              rs=[r for r in rows if r[2]==z]
              tot=sum(r[3] for r in rs)/1e6
              big=[r for r in rs if r[3]>90e6]
              print(f"z{z}: {len(rs)} células, total {tot:.0f} MB, acima de 90 MB: {len(big)}, maior {max(r[3] for r in rs)/1e6:.0f} MB")
              for r in sorted(rs,key=lambda r:-r[3])[:12]:
                  print(f"   z{z} lon {r[0]} lat {r[1]} -> {r[3]/1e6:.1f} MB")
          # oeste de SC (região do usuário): lon -54..-52, lat -28..-26
          for z in (13,14):
              rs=[r for r in rows if r[2]==z and r[0] in (-54,-53) and r[1] in (-28,-27)]
              print(f"oeste SC z{z}:", [(r[0],r[1],round(r[3]/1e6,1)) for r in rs], "total", round(sum(r[3] for r in rs)/1e6,1), "MB")
          PY

          say "== extração real: oeste de SC (4 células, z14)"
          mkdir -p out
          for lon in -54 -53; do for lat in -28 -27; do
            w=$lon; e=$((lon+1)); s=$lat; n=$((lat+1))
            ./pmtiles extract $SRC out/c_${w}_${s}.pmtiles --bbox=$w,$s,$e,$n --maxzoom=14 > /dev/null 2>&1
          done; done
          ls -l out | tee -a $R

          say "== raw.githubusercontent: CORS e Range"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan probe-raw
          git rm -rf . > /dev/null 2>&1 || true
          cp out/c_-53_-27.pmtiles t.pmtiles
          git add t.pmtiles
          git commit -q -m "teste raw"
          git push -q -f origin probe-raw
          sleep 8
          RAW=https://raw.githubusercontent.com/${{ github.repository }}/probe-raw/t.pmtiles
          say "RAW=$RAW"
          say "-- HEAD com Origin"
          curl -sI -H "Origin: https://localhost" $RAW | tee -a $R
          say "-- Range 0-99 com Origin"
          curl -s -D - -o /tmp/r.bin -H "Origin: https://localhost" -H "Range: bytes=0-99" $RAW | tee -a $R
          ls -l /tmp/r.bin | tee -a $R
          say "== fim"

          git checkout --orphan probe-result2
          git rm -rf . > /dev/null 2>&1 || true
          cp $R /tmp/report2.txt; cp /tmp/report2.txt report2.txt
          git add report2.txt
          git commit -q -m "relatorio 2"
          git push -q -f origin probe-result2
